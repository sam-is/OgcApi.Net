name: Publish nuget packages

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for NuGet trusted publishing (OIDC)

    env:
      VERSION: ${{ github.event.release.tag_name }}

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore OgcApi.Net.slnx
    - name: Build
      run: dotnet build -c Release --no-restore OgcApi.Net.slnx -p:ContinuousIntegrationBuild=true
    - name: Pack
      run: |
        mkdir artifacts
        dotnet pack OgcApi.Net.slnx -c Release -o artifacts --no-restore --no-build -p:PackageVersion=${VERSION#v} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

    - name: NuGet Login
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USERNAME }}

    - name: Publish
      run: |
        dotnet nuget push "./artifacts/*.nupkg" --skip-duplicate --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
        dotnet nuget push "./artifacts/*.snupkg" --skip-duplicate --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
        rm -rf artifacts
